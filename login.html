<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="loginPageTitle">DENTA STORE - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f9f9f9; color: #333; }
        .top-bar { background-color: #0b1c3f; color: #fff; font-size: 13px; padding: 8px 3%; display: flex; justify-content: space-between; align-items: center; position: relative !important; height: 40px !important; }
        header { background-color: #fff; border-bottom: 1px solid #e5e5e5; padding: 15px 3%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-area img { height: 65px; width: auto; object-fit: contain; }
        .page-wrapper { max-width: 500px; margin: 50px auto; padding: 0 20px; }
        .auth-card { background: white; border: 1px solid #e5e5e5; border-radius: 10px; padding: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .auth-title { font-size: 22px; color: #0b1c3f; margin-bottom: 25px; font-weight: bold; text-align: center; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #0b1c3f; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-family: 'Cairo', sans-serif; outline: none; }
        .btn-submit { background: #0056b3; color: #fff; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; font-family: 'Cairo', sans-serif; margin-top: 10px; }
        .btn-submit:hover { background: #004085; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .auth-footer a { color: #0056b3; text-decoration: none; font-weight: bold; }
        
        .currency-selector { background: #0056b3; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; outline: none; }
        #langSelect {
            position: absolute !important;
            left: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
        }
        
        html, body { overflow-x: hidden !important; width: 100% !important; }
        .top-bar span, .top-bar p { display: none !important; }
    </style>
</head>
<body id="bodyTag">

    <div class="top-bar">
        <div><span><i class="fa-solid fa-user-lock"></i> بوابة تسجيل الدخول الآمنة</span></div>
        <select id="langSelect" class="currency-selector" onchange="changeLanguage(this.value)">
            <option value="ar">العربية</option>
            <option value="tr">Türkçe</option>
        </select>
    </div>

    <header>
        <div class="logo-area"><a href="index.html"><img src="logo.jpg" alt="DENTA STORE Logo"></a></div>
    </header>

    <div class="page-wrapper">
        <div class="auth-card">
            <div class="auth-title" data-key="loginCardTitle">تسجيل الدخول لحسابك</div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group" id="groupEmail">
                    <label data-key="emailLabel">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group" id="groupPass">
                    <label data-key="passwordLabel">كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="********" required>
                </div>
                <button type="submit" class="btn-submit" data-key="loginBtnText">تسجيل الدخول</button>
            </form>
            
            <div class="auth-footer" id="authFooter">
                <span data-key="noAccountText">ليس لديك حساب؟</span> <a href="register.html" data-key="createAccountLink">انشئ حساباً جديداً</a>
            </div>
        </div>
    </div>

    <!-- ملف الترجمة العام -->
    <script src="lang.js"></script>

    <script>
        if (typeof translations === 'undefined') { window.translations = {}; }
        if (!translations['tr']) translations['tr'] = {};
        if (!translations['ar']) translations['ar'] = {};

        const extraTranslations = {
            ar: {
                loginPageTitle: "DENTA STORE - تسجيل الدخول",
                loginCardTitle: "تسجيل الدخول لحسابك",
                emailLabel: "البريد الإلكتروني",
                passwordLabel: "كلمة المرور",
                loginBtnText: "تسجيل الدخول",
                noAccountText: "ليس لديك حساب؟",
                createAccountLink: "انشئ حساباً جديداً",
                adminUserText: "مدير المتجر",
                unregisteredAlert: "هذا الحساب غير مسجل من قبل! يرجى إنشاء حساب جديد أولاً.",
                wrongPasswordAlert: "كلمة المرور غير صحيحة، يرجى المحاولة مرة أخرى."
            },
            tr: {
                loginPageTitle: "DENTA STORE - Giriş Yap",
                loginCardTitle: "Hesabınıza Giriş Yapın",
                emailLabel: "E-posta Adresi",
                passwordLabel: "Şifre",
                loginBtnText: "Giriş Yap",
                noAccountText: "Hesabınız yok mu?",
                createAccountLink: "Yeni bir hesap oluşturun",
                adminUserText: "Mağaza Yöneticisi",
                unregisteredAlert: "Bu hesap daha önce kaydedilmemiş! Lütfen önce yeni bir hesap oluşturun.",
                wrongPasswordAlert: "Hatalı şifre, lütfen tekrar deneyin."
            }
        };

        for (let lang in extraTranslations) {
            for (let key in extraTranslations[lang]) {
                if (!translations[lang][key]) {
                    translations[lang][key] = extraTranslations[lang][key];
                }
            }
        }

        function changeLanguage(lang) {
            localStorage.setItem('dentaLang', lang);
            applyLanguage(lang);
        }

        function applyLanguage(lang) {
            if (!translations[lang]) return;

            const htmlRoot = document.getElementById('htmlRoot');
            htmlRoot.setAttribute('lang', lang);
            htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            // ضبط اتجاه النموذج والنصوص بحسب اللغة
            const groupEmail = document.getElementById('groupEmail');
            const groupPass = document.getElementById('groupPass');
            const authFooter = document.getElementById('authFooter');
            
            if (groupEmail) groupEmail.style.textAlign = lang === 'ar' ? 'right' : 'left';
            if (groupPass) groupPass.style.textAlign = lang === 'ar' ? 'right' : 'left';
            if (authFooter) authFooter.style.textAlign = 'center';

            document.querySelectorAll('[data-key]').forEach(element => {
                const key = element.getAttribute('data-key');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            const langSelect = document.getElementById('langSelect');
            if (langSelect) langSelect.value = lang;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const savedLang = localStorage.getItem('dentaLang') || 'ar';
            applyLanguage(savedLang);
        });

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const currentLang = localStorage.getItem('dentaLang') || 'ar';

            if (email === 'dentastore00@gmail.com') {
                const adminName = translations[currentLang]['adminUserText'] || 'مدير المتجر';
                const adminUser = { name: adminName, email: 'dentastore00@gmail.com', type: 'admin' };
                localStorage.setItem('dentaActiveUser', JSON.stringify(adminUser));
                window.location.href = 'admin.html';
                return;
            }

            const users = JSON.parse(localStorage.getItem('dentaUsers')) || [];
            const userExists = users.some(u => u.email === email);

            if (!userExists) {
                alert(translations[currentLang]['unregisteredAlert'] || 'هذا الحساب غير مسجل من قبل! يرجى إنشاء حساب جديد أولاً.');
                window.location.href = 'register.html';
                return;
            }

            const matchedUser = users.find(u => u.email === email && u.password === password);

            if (matchedUser) {
                localStorage.setItem('dentaActiveUser', JSON.stringify(matchedUser));
                window.location.href = 'account.html';
            } else {
                alert(translations[currentLang]['wrongPasswordAlert'] || 'كلمة المرور غير صحيحة، يرجى المحاولة مرة أخرى.');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
    // 1. قراءة اللغة المخزنة (الافتراضي عربي إذا لم يتم الاختيار مسبقاً 'ar')
    const savedLang = localStorage.getItem('dentaLang') || 'ar';
    
    // 2. ضبط اتجاه الصفحة تلقائياً (RTL للغة العربية، LTR للغات الأخرى كالتركية)
    if (savedLang === 'ar') {
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.setAttribute('lang', 'ar');
    } else {
        document.documentElement.setAttribute('dir', 'ltr');
        document.documentElement.setAttribute('lang', savedLang);
    }
    
    // 3. استدعاء دالة تطبيق الترجمات على نصوص الصفحة الحالية
    if (typeof applyTranslations === 'function') {
        applyTranslations(savedLang);
    }
});
    </script>
</body>
</html>
